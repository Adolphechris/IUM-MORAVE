name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Debug Node/npm
        run: |
          node -v
          npm -v
          pwd
          ls -la
      - name: Install root dependencies
        run: |
          set -eux
          if [ -f package.json ]; then
            npm install --workspaces=false
          else
            echo "No root package.json found — skipping root install"
          fi
      - name: Lint and build frontends
        run: |
          set -eux
          for app in apps/web apps/student-space apps/teacher-space apps/admin-dashboard; do
            npm --prefix "$app" install --silent
            npm --prefix "$app" run lint
            npm --prefix "$app" run build
          done
      - name: Test backend services
        run: npm run test:services
      - name: Fail if build artifacts missing
        run: |
          if [ -d apps/web/.next ] && [ -d apps/student-space/.next ] && [ -d apps/teacher-space/.next ] && [ -d apps/admin-dashboard/.next ]; then
            echo "Artifacts present"
          else
            echo "Build artifacts missing" && exit 1
          fi
