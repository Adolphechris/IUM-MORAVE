name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install root dependencies
        run: npm ci --silent || npm install --silent
      - name: Build frontend
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web && npm install --silent || true && npm run build || true
          else
            echo "no frontend"
          fi
      - name: Run API lint/build
        run: |
          if [ -f apps/api/package.json ]; then
            cd apps/api && npm install --silent || true && npm run build || true
          else
            echo "no api"
          fi
