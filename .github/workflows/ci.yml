name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Debug Node/npm
        run: |
          node -v
          npm -v
          pwd
          ls -la
      - name: Install root dependencies
        run: |
          set -eux
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Lint frontend
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web && npm install --silent && npm run lint
          else
            echo "no frontend"
          fi
      - name: Build frontend
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web && npm run build
          else
            echo "no frontend"
          fi
      - name: Lint and test API
        run: |
          if [ -f apps/api/package.json ]; then
            cd apps/api && npm install --silent && npm run lint && npm test
          else
            echo "no api"
          fi
      - name: Fail if build artifacts missing
        run: |
          if [ -d apps/web/.next ] || [ -f apps/api/index.js ]; then
            echo "Artifacts present"
          else
            echo "Build artifacts missing" && exit 1
          fi
