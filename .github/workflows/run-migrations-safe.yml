name: Run DB Migrations (safe)

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'ci/run-migrations'

jobs:
  run-migrations-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client dnsutils

      - name: Run migrations (safe)
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL-}" ]; then
            echo "DB_URL secret not set — skipping migrations.";
            exit 0
          fi

          host=$(echo "$DB_URL" | sed -n 's/.*@\([^:\/]*\).*/\1/p')
          port=$(echo "$DB_URL" | sed -n 's/.*:\([0-9]\+\)\/.*$/\1/p' || echo "5432")

          echo "Resolving IPv4 for $host"
          ipv4=$(dig +short A "$host" | head -n1 || true)

          if [ -n "$ipv4" ]; then
            echo "IPv4 found: $ipv4 — testing TCP connection to $ipv4:$port"
            if timeout 5 bash -c "</dev/tcp/$ipv4/$port" 2>/dev/null; then
              echo "IPv4 reachable — replacing host with IPv4 in DB_URL"
              DB_URL=$(echo "$DB_URL" | sed "s/@$host/@$ipv4/")
            else
              echo "IPv4 not reachable. Attempting to connect to host using default resolution (may be IPv6)"
            fi
          else
            echo "No IPv4 A record found for $host — will attempt default resolution (may be IPv6)"
            # Supabase direct hosts (db.<ref>.supabase.co) are IPv6-only (AAAA).
            # GitHub runners do not have IPv6, so fall back to the IPv4 pgbouncer
            # pooler. The pooler authenticates with user postgres.<ref> (NOT plain
            # postgres); the database password in DB_URL stays valid.
            if echo "$host" | grep -qE '^db\.[a-z0-9]+\.supabase\.co$'; then
              ref=$(printf '%s' "$host" | sed -n 's/^db\.\([a-z0-9]*\)\.supabase\.co$/\1/p')
              pooler_host="aws-0-eu-west-1.pooler.supabase.com"
              if getent hosts "$pooler_host" >/dev/null 2>&1; then
                echo "Switching to Supabase IPv4 pooler $pooler_host with user postgres.$ref"
                DB_URL=$(echo "$DB_URL" | sed -E "s|^([a-zA-Z][a-zA-Z0-9+.-]*://)postgres:|\\1postgres.${ref}:|")
                DB_URL=$(echo "$DB_URL" | sed "s/@$host/@$pooler_host/")
              fi
            fi
          fi

          echo "Running SQL migrations from db/migrations"
          failed=0
          for f in db/migrations/*.sql; do
            echo "-- running $f"
            if ! PGPASSWORD=$(echo "$DB_URL" | sed -n 's/.*:\/\/.*:\(.*\)@.*/\1/p') psql "$DB_URL" -f "$f"; then
              echo "Migration $f failed to apply. Recording failure and continuing (will not fail CI)."
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "One or more migrations failed or were unreachable. To enforce migrations, run this workflow manually on a runner with network access to the DB or run scripts/run_migrations.sh locally with DB_URL set."
            # Do not fail CI to avoid blocking PRs due to network reachability
          else
            echo "All migrations applied successfully"
          fi

      - name: Run seeds (safe)
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL-}" ]; then
            echo "DB_URL secret not set — skipping seeds.";
            exit 0
          fi
          for f in db/seeds/*.sql; do
            echo "-- seeding $f"
            if ! PGPASSWORD=$(echo "$DB_URL" | sed -n 's/.*:\/\/.*:\(.*\)@.*/\1/p') psql "$DB_URL" -f "$f"; then
              echo "Seeding $f failed or DB unreachable — continuing"
            fi
          done
