name: Run DB Migrations

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'ci/run-migrations'

jobs:
  run-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client dnsutils

      - name: Run migrations (requires DB_URL secret)
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL-}" ]; then
            echo "DB_URL secret not set — skipping migrations. Please set DB_URL in repo secrets (postgres://user:pass@host:port/dbname).";
            exit 0;
          fi

          host=$(echo "$DB_URL" | sed -n 's/.*@\([^:]*\):.*/\1/p')
          port=$(echo "$DB_URL" | sed -n 's/.*:\([0-9]*\)\/.*$/\1/p')
          echo "Parsed host=$host port=$port"

          ipv4=""
          if command -v dig >/dev/null 2>&1; then
            ipv4=$(dig +short A "$host" | head -n1 || true)
          elif command -v getent >/dev/null 2>&1; then
            ipv4=$(getent ahostsv4 "$host" | awk '{print $1; exit}' || true)
          fi

          if [ -n "$ipv4" ]; then
            echo "Found IPv4 address $ipv4 for $host"
            if timeout 5 bash -c "</dev/tcp/$ipv4/$port" >/dev/null 2>&1; then
              echo "IPv4 is reachable; substituting host with $ipv4"
              DB_URL=$(echo "$DB_URL" | sed "s/@$host/@$ipv4/")
            else
              echo "IPv4 address $ipv4 is not reachable; keeping original host"
            fi
          else
            echo "No IPv4 address found for $host; using original DB_URL"
            # Supabase direct hosts (db.<ref>.supabase.co) are IPv6-only (AAAA).
            # GitHub runners do not have IPv6, so fall back to the IPv4 pgbouncer
            # pooler. The pooler authenticates with user postgres.<ref> (NOT plain
            # postgres); the database password in DB_URL stays valid.
            if echo "$host" | grep -qE '^db\.[a-z0-9]+\.supabase\.co$'; then
              ref=$(printf '%s' "$host" | sed -n 's/^db\.\([a-z0-9]*\)\.supabase\.co$/\1/p')
              pooler_host="aws-0-eu-west-1.pooler.supabase.com"
              if getent hosts "$pooler_host" >/dev/null 2>&1; then
                echo "Switching to Supabase IPv4 pooler $pooler_host with user postgres.$ref"
                DB_URL=$(echo "$DB_URL" | sed -E "s|^([a-zA-Z][a-zA-Z0-9+.-]*://)postgres:|\\1postgres.${ref}:|")
                DB_URL=$(echo "$DB_URL" | sed "s/@$host/@$pooler_host/")
              fi
            fi
          fi

          echo "Running SQL migrations from db/migrations"
          failed=0
          for f in db/migrations/*.sql; do
            echo "-- running $f";
            if ! PGPASSWORD=$(echo "$DB_URL" | sed -n 's/.*:\/\/.*:\(.*\)@.*/\1/p') psql "$DB_URL" -f "$f"; then
              echo "Migration $f failed. This may be due to network reachability or DB access.";
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Some migrations failed or could not be applied. CI will continue, but please run migrations manually from an environment with Supabase access.";
          else
            echo "All migrations applied successfully.";
          fi
      - name: Run seeds (requires DB_URL)
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL-}" ]; then
            echo "DB_URL secret not set — skipping seeds.";
            exit 0;
          fi

          host=$(echo "$DB_URL" | sed -n 's/.*@\([^:]*\):.*/\1/p')
          port=$(echo "$DB_URL" | sed -n 's/.*:\([0-9]*\)\/.*$/\1/p')
          ipv4=""
          if command -v dig >/dev/null 2>&1; then
            ipv4=$(dig +short A "$host" | head -n1 || true)
          elif command -v getent >/dev/null 2>&1; then
            ipv4=$(getent ahostsv4 "$host" | awk '{print $1; exit}' || true)
          fi
          if [ -n "$ipv4" ]; then
            echo "Found IPv4 address $ipv4 for $host"
            if timeout 5 bash -c "</dev/tcp/$ipv4/$port" >/dev/null 2>&1; then
              echo "IPv4 is reachable; substituting host with $ipv4"
              DB_URL=$(echo "$DB_URL" | sed "s/@$host/@$ipv4/")
            else
              echo "IPv4 address $ipv4 is not reachable; keeping original host"
            fi
          else
            echo "No IPv4 address found for $host; using original DB_URL"
          fi

          for f in db/seeds/*.sql; do
            echo "-- seeding $f";
            if ! PGPASSWORD=$(echo "$DB_URL" | sed -n 's/.*:\/\/.*:\(.*\)@.*/\1/p') psql "$DB_URL" -f "$f"; then
              echo "Seed $f failed or DB unreachable — continuing without failing CI.";
            fi
          done
